<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oscilloscope</title>
    <style>
        :root {
            --ch-a: #FFD600;
            --ch-b: #00E5FF;
            --ch-a-key: #FFF59D;
            --ch-b-key: #84FFFF;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            display: flex;
        }

        body {
            margin: 0;
            background: #111;
            color: #0f0;
            font: 14px monospace;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 6px 12px;
            background: #1a1a1a;
            flex-shrink: 0;
            border-bottom: 1px solid #2a2a2a;
        }

        #topbar button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 4px 14px;
            cursor: pointer;
            border-radius: 3px;
            font: inherit;
            transition: background 0.15s, color 0.15s;
        }

        #topbar button:hover {
            background: #0f0;
            color: #000;
        }

        #info {
            display: flex;
            gap: 2em;
        }

        #canvas-wrap {
            overflow: auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            margin: 4px 8px;
        }

        #canvas-wrap canvas {
            min-width: 0;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            flex: 1 1 0;
        }

        .v-control-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .v-control-container input {
            flex: 1;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            font: inherit;
            writing-mode: sideways-lr
        }
        .h-control-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .h-control-container input {
            width: 120px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 2px 5px;
            font: inherit;
        }

        #footer {
            text-align: center;
            padding: 4px;
            flex-shrink: 0;
            border-top: 1px solid #2a2a2a;
        }

        #status {
            color: #888;
        }

        .label {
            color: #888;
            text-wrap: nowrap
        }

        .val {
            color: #0f0;
        }

        #bottom-controls {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: #1a1a1a;
            gap: 1.5em;
            flex-shrink: 0;
            border-top: 1px solid #2a2a2a;
        }

        .switch-control {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .switch-control button {
            background: #333;
            height: 1.5em;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0 4px;
            cursor: pointer;
            border-radius: 3px;
            font: inherit;
        }

        .switch-control button {
            transition: background 0.15s, color 0.15s;
        }

        .switch-control button:hover {
            background: #0f0;
            color: #000;
        }

        .switch-control select {
            min-width: 3em;
            height: 1.5em;
            text-align: center;
            color: #0f0;
            background: #222;
            border: 1px solid #0f0;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .button-switch-block {
            display: flex;
            gap: 2px;
            margin-top: 8px;
            background: #222;
            border: 1px solid #0f0;
            border-radius: 3px;
            padding: 2px;
        }

        .trg-btn {
            background: transparent;
            color: #0f0;
            border: none;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 2px;
            line-height: 1;
            min-width: 20px;
            text-align: center;
        }

        .trg-btn:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn { transition: background 0.15s, color 0.15s; }

        .trg-btn.active {
            background: #0f0;
            color: #000;
        }

        .trg-btn.channel-a {
            color: var(--ch-a);
        }

        .trg-btn.channel-a:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn.channel-a.active {
            background: var(--ch-a);
            color: #000;
        }

        .trg-btn.channel-b {
            color: var(--ch-b);
        }

        .trg-btn.channel-b:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn.channel-b.active {
            background: var(--ch-b);
            color: #000;
        }
        #trg\.time\.offset {
            width: 50vh;
        }
    </style>
</head>
<body>
<div id="topbar">
    <button id="refreshBtn">Reload</button>
    <div id="info">
        <span><span class="label">sampling, ns</span> <span class="val" id="sampling">—</span></span>
    </div>
</div>
<div id="canvas-wrap">
    <div class="v-control-container">
        <span class="label"><label for="vbias.a">Bias A</label></span>
        <input type="range" id="vbias.a" class="param-slider" value="0" min="-1000000" max="1000000">
    </div>
    <div class="v-control-container">
        <span class="label"><label for="vbias.b">Bias B</label></span>
        <input type="range" id="vbias.b" class="param-slider" value="0" min="-1000000" max="1000000">
    </div>
    <div class="v-control-container">
        <span class="label"><label for="trg.level">TRG lvl</label></span>
        <input type="range" id="trg.level" class="param-slider" value="0" min="-1000000" max="1000000">
        <div class="button-switch-block" id="trg.chan">
            <button class="trg-btn active channel-a" data-val="0" title="Channel A">A</button>
            <button class="trg-btn  channel-b" data-val="1" title="Channel B">B</button>
        </div>
        <div class="button-switch-block" id="trg.type">
            <button class="trg-btn active" data-val="0" title="None">∅</button>
            <button class="trg-btn" data-val="1" title="Rising">↗</button>
            <button class="trg-btn" data-val="-1" title="Falling">↘</button>
        </div>
    </div>
    <canvas id="scope" width="1200" height="600"></canvas>
</div>
<div id="bottom-controls">
    <div class="switch-control">
        <button>&lt;</button>
        <select id="gain.a">
            <option value="1">x1</option>
            <option value="3">x3</option>
            <option value="6">x7</option>
            <option value="15">x15</option>
            <option value="31">x31</option>
            <option value="63">x63</option>
        </select>
        <button>&gt;</button>
    </div>
    <div class="switch-control">
        <button>&lt;</button>
        <select id="gain.b">
            <option value="1">x1</option>
            <option value="3">x3</option>
            <option value="6">x7</option>
            <option value="15">x15</option>
            <option value="31">x31</option>
            <option value="63">x63</option>
        </select>
        <button>&gt;</button>
    </div>
    <div class="switch-control">
        <button>&lt;</button>
        <select id="sampling.ns">
            <option value="500000000">500ms</option>
            <option value="200000000">200ms</option>
            <option value="100000000">100ms</option>
            <option value="50000000">50ms</option>
            <option value="20000000">20ms</option>
            <option value="10000000">10ms</option>
            <option value="5000000">5ms</option>
            <option value="2000000">2ms</option>
            <option value="1000000">1ms</option>
            <option value="500000" selected="selected">500&micro;s</option>
            <option value="200000">200&micro;s</option>
            <option value="100000">100&micro;s</option>
            <option value="50000">50&micro;s</option>
            <option value="20000">20&micro;s</option>
            <option value="10000">10&micro;s</option>
            <option value="5000">5&micro;s</option>
            <option value="2000">2&micro;s</option>
            <option value="1000">1&micro;s</option>
            <option value="500">0.5&micro;s</option>
        </select>
        <button>&gt;</button>
    </div>
    <div class="h-control-container">
        <span class="label">TRG shift</span>
        <input type="range" id="trg.time.offset" class="param-slider"
               value="0" min="-1000000" max="1000000" list="trg-shift-ticks">
        <datalist id="trg-shift-ticks">
            <option value="0"></option>
            <option value="1000000"></option>
            <option value="2000000"></option>
        </datalist>
    </div>
</div>
<div id="footer"><span id="status">connecting...</span></div>

<script>
    const parameters = {
        "h_grid_steps": 10
    };
    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    const COLORS = {
        chA: cssVar('--ch-a'),
        chB: cssVar('--ch-b'),
        chAKey: cssVar('--ch-a-key'),
        chBKey: cssVar('--ch-b-key'),
    };
    const vltg = {};
    const canvas = document.getElementById("scope");
    const ctx = canvas.getContext("2d");
    let ws = null;

    const param = {
        _values: {},
        _controls: {},
        _debounces: {},
        register(name, el, update, debounceMs) {
            this._controls[name] = { el, update };
            if (debounceMs) this._debounces[name] = this._makeDebouncer(debounceMs);
        },
        _makeDebouncer(ms) {
            let timer;
            return (name, value, opts) => {
                clearTimeout(timer);
                timer = setTimeout(() => this._setNow(name, value, opts), ms);
            };
        },
        _setNow(name, value, opts) {
            this._values[name] = value;
            const ctrl = this._controls[name];
            if (ctrl) ctrl.update(ctrl.el, value);
            if (!opts || opts.send !== false) this._send(name, value);
            this._saveCookie();
        },
        set(name, value, opts) {
            const db = this._debounces[name];
            if (db) { db(name, value, opts); return; }
            this._setNow(name, value, opts);
        },
        get(name) { return this._values[name]; },
        _send(name, value) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(`${name}=${value}\n`);
            }
        },
        sendAllCommands() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                let data = ""
                for (const k in param._controls) {
                    const val = param._values[k]
                    data+=`${k}=${val}\n`
                }
                ws.send(data)
            }
        },
        _saveCookie() {
            const json = JSON.stringify(this._values);
            document.cookie = "scope_params=" + encodeURIComponent(json) + ";path=/;SameSite=Lax";
        },
        _loadCookie() {
            const match = document.cookie.match(new RegExp('(^| )scope_params=([^;]+)'));
            if (match) {
                try {
                    const saved = JSON.parse(decodeURIComponent(match[2]));
                    for (const k in saved) {
                        if (this._controls[k]) {
                            this.set(k, saved[k], {send: false});
                        }
                    }
                } catch(e) {}
            }
        }
    };

    document.querySelectorAll('.param-slider').forEach(slider => {
        slider.oninput = () => param.set(slider.id, slider.value);
        param._values[slider.id] = slider.value
        param.register(slider.id, slider, (el, v) => el.value = String(v), 20);
    });

    document.querySelectorAll(".button-switch-block").forEach(block =>{
        const id = block.id
        const buttons = block.querySelectorAll("button")
        buttons.forEach(button => {
            button.onclick = () => param.set(id, button.dataset.val);
            if (button.classList.contains("active")) param._values[id] = button.dataset.val
        });
        param.register(id, buttons, (els, v) => {
            els.forEach(b => b.classList.toggle('active', b.dataset.val === String(v)));
        });
    });

    const selectParam = {
        wire(id, toWire, fromWire) {
            toWire = toWire || (v => v);
            fromWire = fromWire || (v => v);
            const el = document.getElementById(id);
            param.register(id, el, (el, v) => {
                const sv = fromWire(v);
                for (let opt of el.options) {
                    if (Number(opt.value) === Number(sv)) { el.value = opt.value; return; }
                }
            });
            const btns = el.parentElement.getElementsByTagName("button");
            const step = (d) => {
                const idx = Math.max(0, Math.min(el.options.length - 1, el.selectedIndex + d));
                el.value = el.options[idx].value;
                param.set(id, toWire(el.value));
            };
            btns[0].onclick = () => step(-1);
            btns[1].onclick = () => step(1);
            el.onchange = () => param.set(id, toWire(el.value));
            const idx = Math.max(0, Math.min(el.options.length - 1, el.selectedIndex));
            param._values[id] = el.options[idx].value;
        }
    };
    selectParam.wire("gain.a");
    selectParam.wire("gain.b");
    selectParam.wire("sampling.ns", v => v / 4, v => v * 4);

    param._loadCookie();

    function plot(frame_width, frameColorPairs) {
        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        const W = canvas.width, H = canvas.height;
        const ml = 48, mr = 48, mb = 14; // margins: left, right, bottom
        const gx = ml, gy = 0, gw = W - ml - mr, gh = H - mb; // grid area
        ctx.clearRect(0, 0, W, H);

        // grid
        const hDivs = parameters.h_grid_steps;
        const vDivs = 8;
        const hStep = gw / hDivs;
        const vStep = gh / vDivs;
        const sub = 5;

        // minor grid
        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 1;
        for (let i = 1; i < hDivs * sub; i++) {
            if (i % sub === 0) continue;
            const x = gx + (i / sub) * hStep;
            ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh); ctx.stroke();
        }
        for (let i = 1; i < vDivs * sub; i++) {
            if (i % sub === 0) continue;
            const y = gy + (i / sub) * vStep;
            ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke();
        }

        // major grid
        ctx.strokeStyle = "#33333";
        for (let i = 0; i <= hDivs; i++) {
            const x = gx + i * hStep;
            ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh); ctx.stroke();
        }
        for (let i = 0; i <= vDivs; i++) {
            const y = gy + i * vStep;
            ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke();
        }

        // centre line
        ctx.strokeStyle = "#555";
        const midY = gy + gh / 2;
        ctx.beginPath(); ctx.moveTo(gx, midY); ctx.lineTo(gx + gw, midY); ctx.stroke();

        // time labels
        ctx.fillStyle = "#999";
        ctx.font = "10px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const sp = parseFloat(param.get("sampling.ns")) || 500000;
        const totalTime = sp * frame_width;
        const timePerDiv = totalTime / hDivs;
        for (let i = 1; i < hDivs; i++) {
            const t = i * timePerDiv;
            let label, unit;
            if (t >= 1e9)      { label = (t / 1e9).toFixed(t >= 10e9 ? 1 : 2); unit = "s"; }
            else if (t >= 1e6) { label = (t / 1e6).toFixed(t >= 10e6 ? 1 : 2); unit = "ms"; }
            else if (t >= 1e3) { label = (t / 1e3).toFixed(t >= 10e3 ? 1 : 2); unit = "µs"; }
            else               { label = t.toFixed(0); unit = "ns"; }
            ctx.fillText(label + unit, gx + i * hStep, gy + gh + 2);
        }

        // voltage labels
        ctx.font = "10px monospace";
        function fmtVoltage(uv) {
            if (uv === 0) return "0";
            const abs = Math.abs(uv);
            let val, suffix;
            if (abs >= 1e6)      { val = uv / 1e6; suffix = "V";  }
            else if (abs >= 1e3) { val = uv / 1e3; suffix = "mV"; }
            else                 { val = uv;        suffix = "µV"; }
            const p = Math.abs(val) >= 100 ? 1 : Math.abs(val) >= 10 ? 2 : 3;
            const rounded = Math.round(val * Math.pow(10, p)) / Math.pow(10, p);
            return String(rounded) + suffix;
        }
        if (vltg.minUvA !== undefined && vltg.maxUvA !== undefined && vltg.steps) {
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            for (let i = 1; i < vDivs; i++) {
                const frac = 1 - i / vDivs;
                const uv = vltg.minUvA + frac * (vltg.maxUvA - vltg.minUvA);
                ctx.fillStyle = COLORS.chA;
                ctx.fillText(fmtVoltage(uv), gx - 4, gy + i * vStep);
            }
        }
        if (vltg.minUvB !== undefined && vltg.maxUvB !== undefined && vltg.steps) {
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            for (let i = 1; i < vDivs; i++) {
                const frac = 1 - i / vDivs;
                const uv = vltg.minUvB + frac * (vltg.maxUvB - vltg.minUvB);
                ctx.fillStyle = COLORS.chB;
                ctx.fillText(fmtVoltage(uv), gx + gw + 4, gy + i * vStep);
            }
        }

        const steps = vltg.steps || 4096;
        const scale = gh / steps;
        for (const [data, color] of frameColorPairs) {
            if (!data || data.length < 2) continue;
            const step = gw / frame_width;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            const len = Math.min(frame_width, data.length)
            for (let i = 0; i < len; i++) {
                const x = gx + i * step;
                const y = gy + gh / 2 - (data[i] - steps / 2) * scale;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // 0V reference lines
        ctx.font = "10px monospace";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        if (vltg.minUvA !== undefined && vltg.maxUvA !== undefined) {
            const adc0v = -vltg.minUvA * steps / (vltg.maxUvA - vltg.minUvA);
            const y0v = gy + gh / 2 - (adc0v - steps / 2) * scale;
            ctx.strokeStyle = COLORS.chA;
            ctx.beginPath(); ctx.moveTo(gx, y0v); ctx.lineTo(gx + gw, y0v); ctx.stroke();
            ctx.fillStyle = COLORS.chA;
            ctx.textAlign = "left";
            ctx.textBaseline = "bottom";
            ctx.fillText("0V", gx + 4, y0v > 14 ? y0v - 3 : y0v + 12);
        }
        if (vltg.minUvB !== undefined && vltg.maxUvB !== undefined) {
            const adc0v = -vltg.minUvB * steps / (vltg.maxUvB - vltg.minUvB);
            const y0v = gy + gh / 2 - (adc0v - steps / 2) * scale;
            ctx.strokeStyle = COLORS.chB;
            ctx.beginPath(); ctx.moveTo(gx, y0v); ctx.lineTo(gx + gw, y0v); ctx.stroke();
            ctx.fillStyle = COLORS.chB;
            ctx.textAlign = "right";
            ctx.textBaseline = "bottom";
            ctx.fillText("0V", gx + gw - 4, y0v > 14 ? y0v - 3 : y0v + 12);
        }
        ctx.setLineDash([]);
    }

    function decode(input) {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
        let results = [];

        for (let i = 0; i < input.length; i += 2) {
            const char1 = input[i];
            const char2 = input[i + 1];

            if (!char1 || !char2) break; // Handle odd lengths

            const val1 = alphabet.indexOf(char1);
            const val2 = alphabet.indexOf(char2);

            if (val1 !== -1 && val2 !== -1) {
                // Shift the first 6-bit value left by 6 bits and add the second
                // This effectively combines two 6-bit chars into one 12-bit int
                const combined = (val1 << 6) | val2;
                results.push(combined);
            }
        }

        return results;
    }

    let keyFrame = { samplesA:[], samplesB:[]}
    let frame = {samplesA:[], samplesB:[]}

    function connect() {
        if (ws) {
            ws.close();
            ws = null;
        }
        ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => document.getElementById("status").textContent = "connected";
        ws.onclose = () => document.getElementById("status").textContent = "disconnected";
        ws.onerror = () => document.getElementById("status").textContent = "error";

        ws.onmessage = (e) => {
            const payloadText = e.data;
            if (payloadText.startsWith("error: ")) {
                document.getElementById("status").textContent = "error: " + payloadText.substring(7);
                return;
            }

            const lines = payloadText.split("\n");
            let incomingCommands = {};

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;
                const eqIdx = line.indexOf("=");
                if (eqIdx !== -1) {
                    const k = line.substring(0, eqIdx).trim();
                    incomingCommands[k] = line.substring(eqIdx + 1).trim();
                }
            }
            let samplesA = decode(incomingCommands["data.a"] || "");
            let samplesB = decode(incomingCommands["data.b"] || "");
            if (incomingCommands["head"] === "1") {
                frame = {samplesA: samplesA, samplesB: samplesB}
            } else {
                frame = {samplesA: frame.samplesA.concat(samplesA), samplesB: frame.samplesB.concat(samplesB)}

            }
                if (incomingCommands["keyframe"] === "1") {
                if (incomingCommands["head"] === "1") {
                    keyFrame.samplesA = samplesA
                    keyFrame.samplesB = samplesB
                } else {
                    keyFrame.samplesA = keyFrame.samplesA.concat(samplesA)
                    keyFrame.samplesB = keyFrame.samplesB.concat(samplesB)
                }
                keyFrame.timestamp = Date.now()
                samplesA = null
                samplesB = null
            }
            if (incomingCommands["vltg.steps"] !== undefined) vltg.steps = parseFloat(incomingCommands["vltg.steps"]);
            if (incomingCommands["vltg.min.uv.a"] !== undefined) vltg.minUvA = parseFloat(incomingCommands["vltg.min.uv.a"]);
            if (incomingCommands["vltg.max.uv.a"] !== undefined) vltg.maxUvA = parseFloat(incomingCommands["vltg.max.uv.a"]);
            if (incomingCommands["vltg.min.uv.b"] !== undefined) vltg.minUvB = parseFloat(incomingCommands["vltg.min.uv.b"]);
            if (incomingCommands["vltg.max.uv.b"] !== undefined) vltg.maxUvB = parseFloat(incomingCommands["vltg.max.uv.b"]);
            document.getElementById("sampling").textContent = incomingCommands["sampling.ns"] || "-";
            document.getElementById("status").textContent = "streaming";
            let frameWidth = parseInt(incomingCommands["frame.size"]) || 200;
            const alphaNormal = param._values["trg.type"] === "0" ? "A0" : "30"
            const alphaKeyFrame = Math.max(30, 250 -  Math.ceil(50 * (Date.now() - (keyFrame.timestamp || 0 )) /1000))
                .toString(16).padStart(2,"0")

            plot(frameWidth, [
                [frame.samplesA, COLORS.chA + alphaNormal],
                [keyFrame.samplesA, COLORS.chAKey + alphaKeyFrame],
                [frame.samplesB, COLORS.chB + alphaNormal],
                [keyFrame.samplesB, COLORS.chBKey + alphaKeyFrame]]);
        };
    }

    document.getElementById("refreshBtn").onclick = function () {
        window.location.reload()
    };
    connect();
</script>
</body>
</html>
