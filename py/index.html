<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oscilloscope</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css">
    <style>
        :root {
            --ch-a: #FFD600;
            --ch-b: #00E5FF;
            --ch-a-key: #FFF59D;
            --ch-b-key: #84FFFF;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            display: flex;
        }

        body {
            margin: 0;
            background: #111;
            color: #0f0;
            font: 14px monospace;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 6px 12px;
            background: #1a1a1a;
            flex-shrink: 0;
            border-bottom: 1px solid #2a2a2a;
        }

        #topbar button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 4px 14px;
            cursor: pointer;
            border-radius: 3px;
            font: inherit;
            transition: background 0.15s, color 0.15s;
        }

        #topbar button:hover {
            background: #0f0;
            color: #000;
        }

        #info {
            display: flex;
            gap: 2em;
        }

        #canvas-wrap {
            overflow: auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            margin: 4px 8px;
        }

        #canvas-wrap div#scope {
            min-width: 0;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            flex: 1 1 0;
        }

        .v-controls-a,
        .v-controls-b {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            align-self: stretch;
            min-height: 0;
        }
        .v-controls-a { flex: 0 0 240px; border-right: 1px solid #2a2a2a; }
        .v-controls-b { flex: 0 0 160px; border-left: 1px solid #2a2a2a; }
        .v-controls-a .label { color: var(--ch-a); }
        .v-controls-b .label { color: var(--ch-b); }
        .v-controls-a .val  { color: var(--ch-a); }
        .v-controls-b .val  { color: var(--ch-b); }
        .v-controls-a input { border-color: var(--ch-a); }
        .v-controls-b input { border-color: var(--ch-b); }
        .v-controls-a .trglabel { color: #0f0; }
        .v-controls-a input.trgborder { border-color: #0f0; }
        .detail {
            color: #686868;
            font-size: 9px;
            line-height: 1;
        }
        .trg-btn-sm {
            background: transparent;
            color: #0f0;
            border: 1px solid #555;
            cursor: pointer;
            font: inherit;
            font-size: 9px;
            padding: 0 3px;
            border-radius: 2px;
            line-height: 1.4;
            min-width: 16px;
            text-align: center;
            transition: background 0.15s, color 0.15s;
        }
        .trg-btn-sm:hover { background: #0f0; color: #000; }
        .trg-btn-sm.active { background: #0f0; color: #000; }
        .v-control-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            min-height: 0;
        }

        .v-control-container input {
            flex: 1;
            min-height: 20px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            font: inherit;
            writing-mode: sideways-lr;
        }
        .h-control-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .h-control-container input {
            width: 120px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 2px 5px;
            font: inherit;
        }

        #footer {
            text-align: center;
            padding: 4px;
            flex-shrink: 0;
            border-top: 1px solid #2a2a2a;
        }

        #status {
            color: #888;
        }

        .label {
            color: #888;
            text-wrap: nowrap
        }

        .val {
            color: #0f0;
        }

        #bottom-controls {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 6px 10px;
            background: #1a1a1a;
            gap: 0.8em;
            flex-shrink: 0;
            flex-wrap: wrap;
            border-top: 1px solid #2a2a2a;
        }

        .switch-control {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .switch-control button {
            background: #333;
            height: 1.5em;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0 4px;
            cursor: pointer;
            border-radius: 3px;
            font: inherit;
        }

        .switch-control button {
            transition: background 0.15s, color 0.15s;
        }

        .switch-control button:hover {
            background: #0f0;
            color: #000;
        }

        .switch-control select {
            min-width: 3em;
            height: 1.5em;
            text-align: center;
            color: #0f0;
            background: #222;
            border: 1px solid #0f0;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .button-switch-block {
            display: flex;
            gap: 2px;
            margin-top: 8px;
            background: #222;
            border: 1px solid #0f0;
            border-radius: 3px;
            padding: 2px;
        }

        .trg-btn {
            background: transparent;
            color: #0f0;
            border: none;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 2px;
            line-height: 1;
            min-width: 20px;
            text-align: center;
        }

        .trg-btn:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn { transition: background 0.15s, color 0.15s; }

        .trg-btn.active {
            background: #0f0;
            color: #000;
        }

        .trg-btn.channel-a {
            color: var(--ch-a);
        }

        .trg-btn.channel-a:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn.channel-a.active {
            background: var(--ch-a);
            color: #000;
        }

        .trg-btn.channel-b {
            color: var(--ch-b);
        }

        .trg-btn.channel-b:hover {
            background: #222;
            color: #fff;
        }

        .trg-btn.channel-b.active {
            background: var(--ch-b);
            color: #000;
        }
    </style>
</head>
<body>
<div id="topbar">
    <button id="refreshBtn">Reload</button>
    <div id="info">
        <span><span class="label">sampling, ns</span> <span class="val" id="sampling">—</span></span>
    </div>
</div>
<div id="canvas-wrap">
    <div class="v-controls-a">
        <div class="v-control-container" style="flex:1">
            <span class="label">Gain A</span>
            <input type="range" id="gain.a" class="gain-slider"
                   min="0" max="1000" value="0" step="1">
            <span id="gain.a.val" class="val" style="font-size:11px">×1.0</span>
            <span id="gain.a.detail" class="detail">1+1.0</span>
        </div>
        <div class="v-control-container" style="flex:1">
            <span class="label">Bias A</span>
            <input type="range" id="vbias.a" class="bias-slider"
                   value="0" min="-1000000" max="1000000" step="0.1">
        </div>
        <div class="v-control-container" style="flex:1">
            <span class="label trglabel">TRG</span>
            <input type="range" id="trg.level" class="trgborder"
                   value="0" min="-1000000" max="1000000">
            <div style="display:flex; flex-direction:column; gap:1px; flex-shrink:0;">
                <div class="button-switch-block" id="trg.chan" style="margin:0;padding:1px;gap:1px">
                    <button class="trg-btn-sm active channel-a" data-val="0">A</button>
                    <button class="trg-btn-sm channel-b" data-val="1">B</button>
                </div>
                <div class="button-switch-block" id="trg.type" style="margin:0;padding:1px;gap:1px">
                    <button class="trg-btn-sm active" data-val="0">∅</button>
                    <button class="trg-btn-sm" data-val="1">↗</button>
                    <button class="trg-btn-sm" data-val="-1">↘</button>
                </div>
            </div>
        </div>
    </div>
    <div id="scope"></div>
    <div class="v-controls-b">
        <div class="v-control-container" style="flex:1">
            <span class="label">Gain B</span>
            <input type="range" id="gain.b" class="gain-slider"
                   min="0" max="1000" value="0" step="1">
            <span id="gain.b.val" class="val" style="font-size:11px">×1.0</span>
            <span id="gain.b.detail" class="detail">1+1.0</span>
        </div>
        <div class="v-control-container" style="flex:1">
            <span class="label">Bias B</span>
            <input type="range" id="vbias.b" class="bias-slider"
                   value="0" min="-1000000" max="1000000" step="0.1">
        </div>
    </div>
</div>
<div id="bottom-controls">
    <div class="switch-control">
        <button>&lt;</button>
        <select id="sampling.ns">
            <option value="500000000">500ms</option>
            <option value="200000000">200ms</option>
            <option value="100000000">100ms</option>
            <option value="50000000">50ms</option>
            <option value="20000000">20ms</option>
            <option value="10000000">10ms</option>
            <option value="5000000">5ms</option>
            <option value="2000000">2ms</option>
            <option value="1000000">1ms</option>
            <option value="500000" selected="selected">500&micro;s</option>
            <option value="200000">200&micro;s</option>
            <option value="100000">100&micro;s</option>
            <option value="50000">50&micro;s</option>
            <option value="20000">20&micro;s</option>
            <option value="10000">10&micro;s</option>
            <option value="5000">5&micro;s</option>
            <option value="2000">2&micro;s</option>
            <option value="1000">1&micro;s</option>
            <option value="500">0.5&micro;s</option>
        </select>
        <button>&gt;</button>
    </div>
    <div class="h-control-container" style="min-width:130px">
        <span class="label">TRG shift</span>
        <input type="range" id="trg.time.offset" class="param-slider"
               value="0" min="-1000000" max="1000000" style="width:120px">
    </div>
</div>
<div id="footer"><span id="status">connecting...</span></div>

<script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>
<script>
    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    const COLORS = {
        chA: cssVar('--ch-a'),
        chB: cssVar('--ch-b'),
        chAKey: cssVar('--ch-a-key'),
        chBKey: cssVar('--ch-b-key'),
    };
    const vltg = {};
    let ws = null, uplot = null;
    let frame = { samplesA: [], samplesB: [] };
    let keyFrame = { samplesA: [], samplesB: [] };

    const param = {
        _values: {},
        _controls: {},
        _debounces: {},
        register(name, el, update, debounceMs, methods) {
            this._controls[name] = { el, update, methods };
            if (debounceMs) this._debounces[name] = this._makeDebouncer(debounceMs);
        },
        _makeDebouncer(ms) {
            let timer;
            return (name, value, opts) => {
                clearTimeout(timer);
                timer = setTimeout(() => this._setNow(name, value, opts), ms);
            };
        },
        _setNow(name, value, opts) {
            this._values[name] = value;
            const ctrl = this._controls[name];
            if (ctrl) ctrl.update(ctrl.el, value);
            if (!opts || opts.send !== false) this._send(name, value);
            this._saveCookie();
        },
        set(name, value, opts) {
            const db = this._debounces[name];
            if (db) { db(name, value, opts); return; }
            this._setNow(name, value, opts);
        },
        get(name) { return this._values[name]; },
        _send(name, value) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const ctrl = this._controls[name];
                const val = ctrl && ctrl.methods && ctrl.methods.send ? ctrl.methods.send(value) : String(value);
                ws.send(`${name}=${val}\n`);
            }
        },
        sendAllCommands() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                let data = ""
                for (const k in param._controls) {
                    const ctrl = param._controls[k];
                    const raw = param._values[k];
                    const val = ctrl && ctrl.methods && ctrl.methods.send ? ctrl.methods.send(raw) : String(raw);
                    data += `${k}=${val}\n`;
                }
                ws.send(data)
            }
        },
        _saveCookie() {
            const json = JSON.stringify(this._values);
            document.cookie = "scope_params=" + encodeURIComponent(json) + ";path=/;SameSite=Lax";
        },
        _loadCookie() {
            const match = document.cookie.match(new RegExp('(^| )scope_params=([^;]+)'));
            if (match) {
                try {
                    const saved = JSON.parse(decodeURIComponent(match[2]));
                    for (const k in saved) {
                        if (this._controls[k]) {
                            this.set(k, saved[k], {send: false});
                        }
                    }
                } catch(e) {}
            }
        }
    };

    document.querySelectorAll('.param-slider').forEach(slider => {
        slider.oninput = () => param.set(slider.id, slider.value);
        param._values[slider.id] = slider.value
        param.register(slider.id, slider, (el, v) => el.value = String(v), 20);
    });

    document.querySelectorAll(".button-switch-block").forEach(block =>{
        const id = block.id
        const buttons = block.querySelectorAll("button")
        buttons.forEach(button => {
            button.onclick = () => param.set(id, button.dataset.val);
            if (button.classList.contains("active")) param._values[id] = button.dataset.val
        });
        param.register(id, buttons, (els, v) => {
            els.forEach(b => b.classList.toggle('active', b.dataset.val === String(v)));
        });
    });

    const selectParam = {
        wire(id, toWire, fromWire) {
            toWire = toWire || (v => v);
            fromWire = fromWire || (v => v);
            const el = document.getElementById(id);
            param.register(id, el, (el, v) => {
                const sv = fromWire(v);
                for (let opt of el.options) {
                    if (Number(opt.value) === Number(sv)) { el.value = opt.value; return; }
                }
            });
            const btns = el.parentElement.getElementsByTagName("button");
            const step = (d) => {
                const idx = Math.max(0, Math.min(el.options.length - 1, el.selectedIndex + d));
                el.value = el.options[idx].value;
                param.set(id, toWire(el.value));
            };
            btns[0].onclick = () => step(-1);
            btns[1].onclick = () => step(1);
            el.onchange = () => param.set(id, toWire(el.value));
            const idx = Math.max(0, Math.min(el.options.length - 1, el.selectedIndex));
            param._values[id] = el.options[idx].value;
        }
    };
    selectParam.wire("sampling.ns", v => v / 4, v => v * 4);

    param._loadCookie();

    const HW_GAINS = [63, 31, 15, 6, 3, 1];
    const rawUvRange = { minA: -1650000, maxA: 1650000, minB: -1650000, maxB: 1650000 };
    const swState = { a: { zoom: 1, offset: 0 }, b: { zoom: 1, offset: 0 } };

    const _LOG_MAX = Math.log(504);

    function posToGain(pos) {
      return Math.round(Math.exp(pos / 1000 * _LOG_MAX) * 100) / 100;
    }

    function gainToPos(gain) {
      return Math.round(Math.log(Math.max(1, gain)) / _LOG_MAX * 1000);
    }

    function splitGain(total) {
      for (const hw of HW_GAINS) {
        if (hw <= total) {
          const sw = total / hw;
          if (sw <= 8) return { hw, sw: Math.round(sw * 100) / 100 };
        }
      }
      return { hw: 63, sw: Math.round(total / 63 * 100) / 100 };
    }

    function updateDisplayRange() {
      for (const ch of ['A', 'B']) {
        const lc = ch.toLowerCase();
        const zoom = swState[lc].zoom || 1;
        const offset = swState[lc].offset || 0;
        const rawMin = rawUvRange['min' + ch];
        const rawMax = rawUvRange['max' + ch];
        const center = (rawMin + rawMax) / 2 + offset;
        const halfRange = (rawMax - rawMin) / 2 / zoom;
        vltg['minUv' + ch] = center - halfRange;
        vltg['maxUv' + ch] = center + halfRange;
      }
    }

    const _track = { gainPos: {}, biasTotal: {} };

    function setupGainSlider(ch) {
      const el = document.getElementById('gain.' + ch);
      const valEl = document.getElementById('gain.' + ch + '.val');
      const detEl = document.getElementById('gain.' + ch + '.detail');
      function apply(pos) {
        const gain = posToGain(pos);
        const { hw, sw } = splitGain(gain);
        swState[ch].zoom = sw;
        _track.gainPos[ch] = pos;
        if ((ch === 'a' && ((parseFloat(param.get('trg.chan')) || 0) === 0)) ||
            (ch === 'b' && ((parseFloat(param.get('trg.chan')) || 0) === 1)))
          param.set('trg.level', param.get('trg.level'));
        param.set('gain.' + ch, hw);
        _trackSaveCookie();
        valEl.textContent = '\u00d7' + gain.toFixed(2);
        detEl.textContent = hw + '+' + sw.toFixed(1);
        updateDisplayRange();
        if (uplot) uplot.redraw();
      }
      el.oninput = function () { apply(parseFloat(this.value)); };
      el.apply = apply;
    }

    function setupBiasSlider(ch) {
      const el = document.getElementById('vbias.' + ch);
      function apply(total) {
        const hw = Math.trunc(total);
        const residual = total - hw;
        const range = (rawUvRange['max' + ch.toUpperCase()] || 1650000) - (rawUvRange['min' + ch.toUpperCase()] || -1650000);
        const offsetUv = residual * range / 2000000;
        swState[ch].offset = offsetUv;
        swState[ch].offsetPpm = residual;
        _track.biasTotal[ch] = total;
        param.set('vbias.' + ch, hw);
        if ((ch === 'a' && ((parseFloat(param.get('trg.chan')) || 0) === 0)) ||
            (ch === 'b' && ((parseFloat(param.get('trg.chan')) || 0) === 1)))
          param.set('trg.level', param.get('trg.level'));
        _trackSaveCookie();
        updateDisplayRange();
        if (uplot) uplot.redraw();
      }
      el.oninput = function () { apply(parseFloat(this.value)); };
      el.apply = apply;
    }

    // Register gain/bias command params (no UI binding — slider handles it)
    param.register('gain.a', null, () => {}); param._values['gain.a'] = 1;
    param.register('gain.b', null, () => {}); param._values['gain.b'] = 1;
    param.register('vbias.a', null, () => {}); param._values['vbias.a'] = 0;
    param.register('vbias.b', null, () => {}); param._values['vbias.b'] = 0;

    setupGainSlider('a');
    setupGainSlider('b');
    setupBiasSlider('a');
    setupBiasSlider('b');

    (function() {
      const el = document.getElementById('trg.level');
      param.register('trg.level', el, (el, v) => el.value = String(v), undefined, {
        send(value) {
          const raw = parseFloat(value) || 0;
          const trgChan = parseFloat(param._values['trg.chan']) || 0;
          const lc = trgChan === 0 ? 'a' : 'b';
          const zoom = swState[lc].zoom || 1;
          const biasPpm = swState[lc].offsetPpm || 0;
          return String(Math.max(-1000000, Math.min(1000000, Math.round(raw / zoom + biasPpm))));
        }
      });
      param._values['trg.level'] = el.value;
      el.oninput = function () { param.set('trg.level', this.value); };
    }());

    // Separate cookie for tracking data (never in param._values)
    function _trackSaveCookie() {
      document.cookie = "scope_track=" + encodeURIComponent(JSON.stringify(_track)) + ";path=/;SameSite=Lax";
    }
    function _trackLoadCookie() {
      const m = document.cookie.match(new RegExp('(^| )scope_track=([^;]+)'));
      if (m) {
        try {
          Object.assign(_track, JSON.parse(decodeURIComponent(m[2])));
          if (!_track.gainPos) _track.gainPos = {};
          if (!_track.biasTotal) _track.biasTotal = {};
        } catch(e) {}
      }
    }

    // Restore slider positions from scope_params cookie (migrate old values)
    (function () {
      const restoreVals = {};
      const cookieMatch = document.cookie.match(new RegExp('(^| )scope_params=([^;]+)'));
      if (cookieMatch) {
        try { Object.assign(restoreVals, JSON.parse(decodeURIComponent(cookieMatch[2]))); }
        catch (e) {}
      }
      // Read from separate track cookie (new), fall back to old scope_params keys (migration)
      _trackLoadCookie();
      function restoreGain(ch) {
        const hw = parseFloat(param.get('gain.' + ch)) || 1;
        const el = document.getElementById('gain.' + ch);
        if (_track.gainPos[ch] !== undefined) {
          el.value = String(Math.min(1000, Math.max(0, _track.gainPos[ch])));
        } else {
          const savedTotal = parseFloat(restoreVals['gain.' + ch + '.total']);
          const pos = !isNaN(savedTotal) ? gainToPos(Math.min(504, Math.max(1, savedTotal))) : gainToPos(hw);
          el.value = String(pos);
          _track.gainPos[ch] = pos;
        }
        el.apply(_track.gainPos[ch]);
      }
      function restoreBias(ch) {
        const hw = parseFloat(param.get('vbias.' + ch)) || 0;
        const el = document.getElementById('vbias.' + ch);
        if (_track.biasTotal[ch] !== undefined) {
          el.value = String(Math.min(1000000, Math.max(-1000000, _track.biasTotal[ch])));
        } else {
          const savedTotal = parseFloat(restoreVals['vbias.' + ch + '.total']);
          const total = !isNaN(savedTotal) ? savedTotal : hw;
          el.value = String(Math.min(1000000, Math.max(-1000000, total)));
          _track.biasTotal[ch] = total;
        }
        el.apply(_track.biasTotal[ch]);
      }
      restoreGain('a'); restoreGain('b');
      restoreBias('a'); restoreBias('b');
      // Save track cookie now that restore is complete
      _trackSaveCookie();
    }());

    function fmtVoltages(uPlot, splits) {
        const range = Math.max(...splits) - Math.min(...splits)
        let mult, sign, decimals
        [mult, sign, decimals] =
            range >= 10e6 ? [1e-6,"V",1] :
            range >= 1e6 ? [1e-6,"V",2] :
            range >= 10e3 ? [1e-3,"mV",1] :
            range >= 1e3 ? [1e-3,"mV",2] :
            range >= 10 ? [1,"µV",1] :
            range >= 1 ? [1,"µV",2] : [1e3,"nV",0]
        return splits.map(t => ((t*mult).toFixed(decimals) + sign))
    }

    function adcToUv(adc, min, max) {
        if(adc === undefined) return null
        const steps = vltg.steps || 4096;
        if (min !== undefined && max !== undefined) {
            return min + (adc / steps) * (max - min);
        }
        return (adc / steps) * 3300000 - 1650000;
    }

    function initUplot() {
        const el = document.getElementById("scope");
        const rect = el.getBoundingClientRect();
        const w = rect.width || 600, h = rect.height || 400;
        function seriesColor(u, seriesIdx) {
            const baseColor = seriesIdx % 2 === 0 ? COLORS.chB : COLORS.chA
            return baseColor + (param._values["trg.type"] === "0" ? "A0" : "50")
        }


        function keySeriesColor(u, seriesIdx) {
            const baseColor = seriesIdx % 2 === 0 ? COLORS.chBKey : COLORS.chAKey
            const alpha = Math.max(30, 250 -  Math.ceil(50 * (Date.now() - (keyFrame.timestamp || 0 )) /1000))
                .toString(16).padStart(2,"0")
            return baseColor + alpha
        }
        try {
            const grid = {show: true, width: 1, size: 20, stroke:"#333333", dash:[3,8]}
            uplot = new uPlot({
                width: w, height: h,
                cursor: { show: true },
                legend: { show: false },
                select: { show: true },
                scales: {
                    chA: { range: (self, initMin, initMax) => [vltg.minUvA ?? -1650000, vltg.maxUvA ?? 1650000] },
                    chB: { range: (self, initMin, initMax) => [vltg.minUvB ?? -1650000, vltg.maxUvB ?? 1650000] },
                },
                axes: [
                    {
                        scale: "x", stroke: "#FFF", grid:grid,
                        values: (self, splits) => {
                            const range = Math.max(...splits) - Math.min(...splits)
                            let mult, sign, decimals
                            [mult, sign, decimals] =
                                range >= 10e3 ? [1e-3,"s",0] :
                                range >= 1e3 ? [1e-3,"s",1] :
                                range >= 10 ? [1,"ms",0] :
                                range >= 1 ? [1,"ms",1] :
                                range >= 10e-3 ? [1e3,"µs",0] :
                                range >= 1e-3 ? [1e3,"µs",1] : [1e6,"ns",0]
                            return splits.map(t => ((t*mult).toFixed(decimals) + sign))
                        },
                    },
                    {scale: "chA", side: 3, values: fmtVoltages, stroke: COLORS.chAKey, size:90, grid: grid},
                    {scale: "chB", side: 1, values: fmtVoltages, stroke: COLORS.chBKey, size:90},
                ],
                series: [
                    {},
                    { scale: "chA", stroke: seriesColor, width: 2, points: { show: false } },
                    { scale: "chB", stroke: seriesColor, width: 2, points: { show: false } },
                    { scale: "chA", stroke: keySeriesColor, width: 2, points: { show: false } },
                    { scale: "chB", stroke: keySeriesColor, width: 2, points: { show: false } }
                ],
                hooks: {
                     drawAxes: [(self) => {
                        const ctx = self.ctx;
                        ctx.save();
                        ctx.setLineDash([4, 4]);
                        ctx.lineWidth = 1;
                        for (const ch of [{a:'chA',c:COLORS.chA },{a:'chB',c:COLORS.chB}]) {
                            const y = self.valToPos(0, ch.a, true);
                            if (y < -10 || y > self.height + 10) continue;
                            const x0 = self.bbox.left, x1 = x0 + self.bbox.width;
                            ctx.strokeStyle = ch.c;
                            ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
                        }
                         ctx.setLineDash([]);
                         // Trigger level line — maps slider fraction directly into visible µV range
                         const trgPpm = parseFloat(param.get('trg.level'));
                         if (!isNaN(trgPpm)) {
                            const trgChan = parseFloat(param.get('trg.chan')) || 0;
                            const scaleName = trgChan === 0 ? 'chA' : 'chB';
                            const minUv = trgChan === 0 ? (vltg.minUvA ?? -1650000) : (vltg.minUvB ?? -1650000);
                            const maxUv = trgChan === 0 ? (vltg.maxUvA ??  1650000) : (vltg.maxUvB ??  1650000);
                            const frac = (trgPpm + 1000000) / 2000000;
                            const trgUv = minUv + frac * (maxUv - minUv);
                            const y = self.valToPos(trgUv, scaleName, true);
                            const x0 = self.bbox.left, x1 = x0 + self.bbox.width;
                            ctx.strokeStyle = '#ff69b4';
                            ctx.lineWidth = 1.5;
                            ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
                         }
                         ctx.restore();
                     }],
                },
            }, [[0], [0], [0], [0], [0]], el);
        } catch (e) { console.error("uPlot init fail:", e); }
        window.addEventListener("resize", () => {
            const r = el.getBoundingClientRect();
            if (uplot) uplot.setSize({ width: r.width, height: r.height });
        });
    }

    function updatePlot(frameWidth) {
        function padArray(arr){
            return arr.concat(...Array(Math.max(0, frameWidth - arr.length)).fill(null))
        }
        function clamp(arr, lo, hi) {
            if (lo === undefined || hi === undefined) return arr;
            return arr.map(v => v === null ? null : Math.max(lo, Math.min(hi, v)));
        }
        if (!uplot) return;
        try {
            const sp = parseFloat(param.get("sampling.ns")) || 500000;
            if (Math.min(frame.samplesA.length, frame.samplesB.length) < 2) return;
            const totalNs = sp * frameWidth;
            const xs = new Array(frameWidth);
            const dataA = clamp(padArray(frame.samplesA), vltg.minUvA, vltg.maxUvA)
            const dataB = clamp(padArray(frame.samplesB), vltg.minUvB, vltg.maxUvB)
            const dataKeyA = clamp(padArray(keyFrame.samplesA), vltg.minUvA, vltg.maxUvA)
            const dataKeyB = clamp(padArray(keyFrame.samplesB), vltg.minUvB, vltg.maxUvB)

            for (let i = 0; i < frameWidth; i++) {
                xs[i] = i * totalNs / frameWidth / 1e6;
            }
            uplot.setData([xs, dataA, dataB, dataKeyA, dataKeyB], true);
        } catch (e) { console.error("updatePlot:", e); }
    }

    function decode(input) {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
        let results = [];

        for (let i = 0; i < input.length; i += 2) {
            const char1 = input[i];
            const char2 = input[i + 1];

            if (!char1 || !char2) break; // Handle odd lengths

            const val1 = alphabet.indexOf(char1);
            const val2 = alphabet.indexOf(char2);

            if (val1 !== -1 && val2 !== -1) {
                // Shift the first 6-bit value left by 6 bits and add the second
                // This effectively combines two 6-bit chars into one 12-bit int
                const combined = (val1 << 6) | val2;
                results.push(combined);
            }
        }

        return results;
    }

    function connect() {
        if (ws) {
            ws.close();
            ws = null;
        }
        ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => document.getElementById("status").textContent = "connected";
        ws.onclose = () => document.getElementById("status").textContent = "disconnected";
        ws.onerror = () => document.getElementById("status").textContent = "error";

        ws.onmessage = (e) => {
            const payloadText = e.data;
            if (payloadText.startsWith("error: ")) {
                document.getElementById("status").textContent = "error: " + payloadText.substring(7);
                return;
            }

            const lines = payloadText.split("\n");
            let incomingCommands = {};

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;
                const eqIdx = line.indexOf("=");
                if (eqIdx !== -1) {
                    const k = line.substring(0, eqIdx).trim();
                    incomingCommands[k] = line.substring(eqIdx + 1).trim();
                }
            }
            let samplesA = decode(incomingCommands["data.a"] || "");
            let samplesB = decode(incomingCommands["data.b"] || "");
            samplesA = samplesA.map(v => adcToUv(v, rawUvRange.minA, rawUvRange.maxA));
            samplesB = samplesB.map(v => adcToUv(v, rawUvRange.minB, rawUvRange.maxB));
            if (incomingCommands["head"] === "1") {
                frame = {samplesA: samplesA, samplesB: samplesB}
            } else {
                frame = {samplesA: frame.samplesA.concat(samplesA), samplesB: frame.samplesB.concat(samplesB)}

            }
                if (incomingCommands["keyframe"] === "1") {
                if (incomingCommands["head"] === "1") {
                    keyFrame.samplesA = samplesA
                    keyFrame.samplesB = samplesB
                } else {
                    keyFrame.samplesA = keyFrame.samplesA.concat(samplesA)
                    keyFrame.samplesB = keyFrame.samplesB.concat(samplesB)
                }
                keyFrame.timestamp = Date.now()
                samplesA = null
                samplesB = null
            }
            if (incomingCommands["vltg.steps"] !== undefined) vltg.steps = parseFloat(incomingCommands["vltg.steps"]);
            if (incomingCommands["vltg.min.uv.a"] !== undefined) rawUvRange.minA = parseFloat(incomingCommands["vltg.min.uv.a"]);
            if (incomingCommands["vltg.max.uv.a"] !== undefined) rawUvRange.maxA = parseFloat(incomingCommands["vltg.max.uv.a"]);
            if (incomingCommands["vltg.min.uv.b"] !== undefined) rawUvRange.minB = parseFloat(incomingCommands["vltg.min.uv.b"]);
            if (incomingCommands["vltg.max.uv.b"] !== undefined) rawUvRange.maxB = parseFloat(incomingCommands["vltg.max.uv.b"]);
            updateDisplayRange();
            document.getElementById("sampling").textContent = incomingCommands["sampling.ns"] || "-";
            document.getElementById("status").textContent = "streaming";
            let frameWidth = parseInt(incomingCommands["frame.size"]) || 200;
            updatePlot(frameWidth);
        };
    }

    document.getElementById("refreshBtn").onclick = function () {
        window.location.reload()
    };
    initUplot();
    connect();
</script>
</body>
